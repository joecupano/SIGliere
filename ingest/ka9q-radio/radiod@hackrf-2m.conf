# ============================================================================
# sovereign-sigint : radiod@hackrf-2m.conf
#
# ka9q-radio (radiod) configuration for the HackRF One, scoped to the 2m
# band. Target: Dell Precision T5820 / Ubuntu 24.04 server (same box as
# radiod@rx888-hf.conf; radiod supports multiple simultaneous instances,
# one per front end — they do not share hardware or config).
#
# This file lives at /etc/radio/radiod@hackrf-2m.conf once deployed.
# Instance name is "hackrf-2m" (everything after the @, before .conf).
# Start with:   sudo systemctl enable --now radiod@hackrf-2m
# Status with:  systemctl status radiod@hackrf-2m
#
# SCOPE DECISION (deliberate, not a limitation to work around):
#   HackRF's max instantaneous bandwidth is 20 MHz (2-20 Msps quadrature
#   sample rate, per Great Scott Gadgets' own specs). The existing key-
#   frequency list spans TWO bands ~290 MHz apart (2m: 144.39-146.52 MHz,
#   a 2.13 MHz span; 70cm: 433.45-446.0 MHz, a 12.55 MHz span) — either
#   band alone fits easily in one 20 MHz capture, but NOT both together.
#   Since HackRF is single-owner USB like every other front end here, one
#   radiod instance can run at a time. This config covers 2m ONLY; 70cm
#   key-frequency coverage is deliberately out of scope for this device
#   for now (tracked as a follow-on: radiod@hackrf-70cm.conf, toggled the
#   same way rx888-mode.sh toggles the RX-888 between owners — NOT built
#   yet, don't assume it exists).
#
# BEFORE FIRST RUN — VERIFY THIS ON YOUR BUILD, DON'T ASSUME IT WORKS:
#   1. HackRF support in ka9q-radio is build-dependent. Confirm your
#      actual installed radiod build exposes a working hackrf handler
#      before trusting this config:
#        - check for a dynamic module: ls /usr/local/lib/ka9q-radio/
#        - or confirm it was statically linked at build time
#        - a config load ('radiod -I ...') that errors on
#          'hardware = hackrf' means this path isn't available on your
#          build and needs a rebuild with HackRF support enabled first.
#      This is a real go/no-go gate, not a formality — treat a failure
#      here as "HackRF-via-radiod isn't ready," not as a config bug to
#      keep tweaking.
#   2. Confirm avahi-daemon is running — same mDNS dependency as the
#      other radiod instances.
#   3. Single-owner USB rule applies: this HackRF cannot be used by
#      OpenWebRX+, nor by the old vhf_uhf_key_freq_producer.py scan-based
#      capture, while this radiod instance owns it. scripts/sdr-mode.sh's
#      hackrf entry still points at the retired vhf-uhf-occupancy@hackrf
#      scan-based service and needs updating once this instance replaces
#      it operationally (tracked as a follow-on, not done in this file).
# ============================================================================

[global]
hardware = hackrf

status = hackrf-2m-status.local

mode = fm

samprate = 12000

# Same rationale as radiod@rx888-hf.conf and the tabled rtlsdr draft: no
# LAN flooding risk unless deliberately raised.
ttl = 0

# Small channel count (5 channels, one band) — light FFT load compared
# to the RX-888 HF instance. Start conservative, raise only if CPU is
# the bottleneck.
fft-threads = 2

overlap = 5

# ----------------------------------------------------------------------
# Front-end hardware section
# ----------------------------------------------------------------------
[hackrf]
device = "hackrf"
description = "sovereign-sigint HackRF One 2m front end (Comet GP-1)"

# 2m span (144.39-146.52 MHz) is 2.13 MHz; comfortably covered well
# inside HackRF's 20 Msps ceiling. 8 Msps gives ample margin below the
# 2m band edges without pushing toward the top of HackRF's range, where
# USB 2.0 throughput and CPU load both get less forgiving. Revisit if a
# wider window is wanted later (e.g. covering more of the 2m band beyond
# the fixed key-frequency list), but there is no need to run near 20
# Msps just to cover a 2.13 MHz span.
samprate = 8000000

iface = eth0

status = hackrf-2m-status.local
data = hackrf-2m-iq.local
ssrc = 30

# Front-end gain. The prior single-tuner HackRF producer was calibrated at
# LNA 40 / VGA 48 with the Comet GP-1 antenna, and that is still the best
# starting point for this radiod-based 2m config. This is not a claim that
# the same threshold transfers, only that the gain setting is a known-safe
# operating point for this hardware/antenna combination. Recalibrate the
# resulting audio floor once the streams are observed in the field.
lna-gain = 40
if-gain = 48

# ============================================================================
# CHANNEL DEFINITIONS — 2m band only (70cm intentionally excluded; see
# SCOPE DECISION above). Ported from vhf_uhf_key_freq_producer.py's
# KEY_FREQUENCIES list, 2m entries only, same frequencies and labels —
# now demodulated simultaneously by radiod instead of retuned-and-scanned
# one at a time by the old producer.
# ============================================================================

[2m-aprs]
freq = 144390000
mode = fm
bandwidth = 15000
data = 2m-aprs-pcm.local

[2m-144900]
freq = 144900000
mode = fm
bandwidth = 15000
data = 2m-144900-pcm.local

[2m-145100]
freq = 145100000
mode = fm
bandwidth = 15000
data = 2m-145100-pcm.local

[2m-iss-145825]
freq = 145825000
mode = fm
bandwidth = 15000
data = 2m-iss-145825-pcm.local

[2m-calling-146520]
freq = 146520000
mode = fm
bandwidth = 15000
data = 2m-calling-146520-pcm.local

# ============================================================================
# NEXT STEPS
#   - FIELD-VERIFY HackRF driver availability in your installed radiod
#     build FIRST (see gate #1 above) — do this before anything else.
#   - Validate this file with: radiod -I /etc/radio/radiod@hackrf-2m.conf
#     and watch for FFT/config/hardware-driver errors.
#   - Confirm each channel's PCM stream with: monitor <data-name>.local
#   - Run radiod_occupancy_producer.py --device hackrf --verbose and
#     calibrate --threshold-dbfs against a known-quiet vs. known-active
#     channel (e.g. key up 146.520 during a local net) before trusting
#     ACTIVE/quiet calls — the RX-888 threshold does NOT transfer.
#   - scripts/sdr-mode.sh's hackrf entry still targets the old scan-based
#     vhf-uhf-occupancy@hackrf service; update it once this instance is
#     validated and intended to replace that operationally.
# ============================================================================
