# ============================================================================
# sovereign-sigint : radiod@hackrf-70cm.conf
#
# ka9q-radio (radiod) configuration for the HackRF One, scoped to the 70cm
# band. Target: Dell Precision T5820 / Ubuntu 24.04 server.
#
# STATUS as of 2026-08-11: one of several selectable HackRF band
#   profiles, NOT currently the active one on this host.
#   UPDATED 2026-08-11 — this header used to say this config was
#   "deliberately NOT hooked into scripts/sdr-mode.sh" and that HackRF
#   driver support itself was unconfirmed. Both are now stale/wrong:
#   `scripts/sdr-mode.sh hackrf` gained real multi-profile support this
#   session (`hackrf list` shows every radiod@hackrf-*.conf found here,
#   including this one; `sudo sdr-mode.sh hackrf ai 70cm` switches to
#   it directly), and HackRF driver support is confirmed working on this
#   build (device found, cross-checked independently with the stock
#   `hackrf_info` tool — see docs/mcp-validation-evidence.md's
#   2026-08-11 entries). HackRF is still single-owner USB hardware, so
#   only one of radiod@hackrf-2m / radiod@hackrf-70cm / any
#   operator-scaffolded profile (`sdr-mode.sh hackrf new <name>`) can
#   own the device at a time — `sdr-mode.sh hackrf ai <profile>` handles
#   stopping whichever other profile is active first.
#
# This file lives at /etc/radio/radiod@hackrf-70cm.conf once deployed
# (`sdr-mode.sh hackrf ai 70cm` deploys it there for you). Instance name
# is "hackrf-70cm". To activate: `sudo ./scripts/sdr-mode.sh hackrf ai 70cm`
# — not a bare `systemctl enable --now`, which would skip the deploy step
# and the single-owner handoff from whichever profile is currently active.
# ============================================================================

[global]
hardware = hackrf

status = hackrf-70cm-status.local

mode = fm

samprate = 12000

ttl = 0

fft-threads = 2

overlap = 5

# ----------------------------------------------------------------------
# Front-end hardware section
# ----------------------------------------------------------------------
[hackrf]
device = "hackrf"
description = "sovereign-sigint HackRF One 70cm front end (Comet GP-1)"

# 70cm span (433.45-446.0 MHz) is 12.55 MHz — comfortably inside HackRF's
# 20 Msps ceiling, same margin logic as the 2m config's 8 Msps choice,
# just needing more headroom here since the span itself is wider. 16
# Msps covers the full span with margin below HackRF's top rate, where
# USB 2.0 throughput and CPU load get less forgiving.
samprate = 16000000

# REMOVED 2026-08-11: this section used to also set iface/status/data/
# ssrc here, apparently copied from radiod@rtlsdr-adhoc.conf's [rtlsdr]
# section. Checked against this build's actual hackrf.c source
# (HackRF_keys[] — see radiod@hackrf-2m.conf's gain comment below for
# the full source-verified key list): none of those four are recognized
# at the [hackrf] hardware-section level on this driver. The advisory
# validator doesn't block startup on an unrecognized key, so this never
# crashed, but `data`/`ssrc` here were silently no-ops -- no wideband IQ
# stream was ever actually being published under hackrf-70cm-iq.local
# despite this file implying one was. status is already set correctly
# in [global] above; removed the redundant/ineffective duplicate here.

# Gain — CORRECTED 2026-08-11, same fix and same source trace as
# radiod@hackrf-2m.conf (docs/mcp-validation-evidence.md, 2026-08-11
# entries). Real key mapping on this build, source-confirmed:
#   lna-gain    -> hackrf_set_antenna_enable() — boolean front-end
#                  amp/antenna-port enable, NOT a dB value. Any nonzero
#                  value behaves identically to 1; the old value here
#                  (40) wrongly implied a chosen gain amount.
#   mixer-gain  -> hackrf_set_lna_gain() — HackRF's actual onboard LNA
#                  gain, 0-40dB in 8dB steps. NOT set here (never was)
#                  — falls back to this build's hardcoded default (24).
#   if-gain     -> hackrf_set_vga_gain() — HackRF's baseband VGA gain,
#                  0-62dB. This one WAS already a real, working gain
#                  value (unlike lna-gain) — 48 is unchanged.
# None of this has been field-swept for this band/antenna combination —
# recalibrate DEVICE_PROFILES/HACKRF_INSTANCE_PROFILES in
# decode/radiod_occupancy_producer.py via a --verbose sweep once this
# profile is actually active, same as every other radiod-backed device
# in this repo.
lna-gain = 1
if-gain = 48

# ============================================================================
# CHANNEL DEFINITIONS — 70cm band only. Ported from
# vhf_uhf_key_freq_producer.py's KEY_FREQUENCIES list, 70cm entries only,
# same frequencies and labels currently in use there.
# ============================================================================

[70cm-433450]
freq = 433450000
mode = fm
data = 70cm-433450-pcm.local

[70cm-438500]
freq = 438500000
mode = fm
data = 70cm-438500-pcm.local

[70cm-432100]
freq = 432100000
mode = fm
data = 70cm-432100-pcm.local

