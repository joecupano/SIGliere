# ============================================================================
# sovereign-sigint : radiod@hackrf-70cm.conf
#
# ka9q-radio (radiod) configuration for the HackRF One, scoped to the 70cm
# band. Target: Dell Precision T5820 / Ubuntu 24.04 server.
#
# STATUS: AVAILABLE FOR FUTURE USE — NOT ACTIVE, NOT WIRED IN.
#   This config exists so 70cm coverage is ready to enable later; it is
#   deliberately NOT hooked into scripts/sdr-mode.sh's hackrf_ai()/
#   hackrf_interactive() functions, which currently toggle
#   radiod@hackrf-2m ONLY. HackRF is single-owner USB (see every other
#   config in this repo) — only one of radiod@hackrf-2m or
#   radiod@hackrf-70cm can own the device at a time, same constraint that
#   split these into two files instead of one in the first place (see
#   radiod@hackrf-2m.conf's SCOPE DECISION note: HackRF's 20 MHz
#   instantaneous bandwidth ceiling can't span 2m and 70cm in one capture).
#   Enabling this file operationally (deciding how the operator switches
#   HackRF between 2m and 70cm coverage — a third sdr-mode.sh state, not
#   just ai/interactive) is a follow-on decision, not made here.
#
# This file lives at /etc/radio/radiod@hackrf-70cm.conf once deployed.
# Instance name is "hackrf-70cm". Start with:
#   sudo systemctl enable --now radiod@hackrf-70cm
# (only after deciding how it coexists with radiod@hackrf-2m — see above)
#
# BEFORE FIRST RUN — SAME FIELD-VERIFY GATE AS radiod@hackrf-2m.conf:
#   HackRF support in ka9q-radio is unconfirmed on this build (the
#   project's own docs disagree — README lists it as optionally
#   supported elsewhere but also says support is still forthcoming, and
#   notes.md describes the driver as set aside pending re-integration).
#   Confirm with a dry-run load (radiod -I ...) or scripts/
#   phase6-hackrf-occupancy-producer.sh's verify step before trusting
#   this loads at all — same gate, don't re-verify twice if hackrf-2m
#   already passed it (same driver, different config).
# ============================================================================

[global]
hardware = hackrf

status = hackrf-70cm-status.local

mode = fm

samprate = 12000

ttl = 0

fft-threads = 2

overlap = 5

# ----------------------------------------------------------------------
# Front-end hardware section
# ----------------------------------------------------------------------
[hackrf]
device = "hackrf"
description = "sovereign-sigint HackRF One 70cm front end (Comet GP-1)"

# 70cm span (433.45-446.0 MHz) is 12.55 MHz — comfortably inside HackRF's
# 20 Msps ceiling, same margin logic as the 2m config's 8 Msps choice,
# just needing more headroom here since the span itself is wider. 16
# Msps covers the full span with margin below HackRF's top rate, where
# USB 2.0 throughput and CPU load get less forgiving.
samprate = 16000000

iface = eth0

status = hackrf-70cm-status.local
data = hackrf-70cm-iq.local
ssrc = 31

# Gain: SAME caveat as radiod@hackrf-2m.conf — these numbers are the
# existing scan-based producer's calibration (LNA 40 / VGA 48), which
# does NOT carry over to radiod's demodulated-audio signal chain.
# Starting point only, not a validated threshold basis. Recalibrate via
# radiod_occupancy_producer.py once this instance is actually running.
lna-gain = 40
if-gain = 48

# ============================================================================
# CHANNEL DEFINITIONS — 70cm band only. Ported from
# vhf_uhf_key_freq_producer.py's KEY_FREQUENCIES list, 70cm entries only,
# same frequencies and labels currently in use there.
# ============================================================================

[70cm-433450]
freq = 433450000
mode = fm
data = 70cm-433450-pcm.local

[70cm-438500]
freq = 438500000
mode = fm
data = 70cm-438500-pcm.local

[70cm-432100]
freq = 432100000
mode = fm
data = 70cm-432100-pcm.local

# ============================================================================
# NEXT STEPS (when this is actually activated, not now)
#   - Decide how HackRF switches between 2m and 70cm coverage — this is
#     a THIRD sdr-mode.sh state beyond ai/interactive, not yet designed.
#   - Field-verify HackRF driver support (see gate above) if not already
#     done via radiod@hackrf-2m.conf.
#   - Validate: radiod -I /etc/radio/radiod@hackrf-70cm.conf
#   - Add a --device hackrf-70cm profile to
#     decode/radiod_occupancy_producer.py's DEVICE_PROFILES (currently
#     only rx888/rtlsdr/hackrf-2m-via-"hackrf" exist) if/when this needs
#     its own producer instance distinct from the 2m one.
#   - Calibrate threshold via --verbose sweep, same as every other
#     radiod-backed device in this repo.
# ============================================================================
