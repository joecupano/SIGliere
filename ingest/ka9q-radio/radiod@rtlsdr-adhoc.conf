# ============================================================================
# sovereign-sigint : radiod@rtlsdr-adhoc.conf
#
# ka9q-radio (radiod) configuration for the RTL-SDR, scoped to AD HOC
# single-frequency tasking — NOT a fixed occupancy channel list like
# radiod@hackrf-2m.conf or radiod@rx888-hf.conf. This device's role
# changed mid-build: no longer VHF/UHF occupancy backup, now dedicated to
# (a) ADS-B [see radiod@rtlsdr-adsb.conf, tracked separately, NOT this
# file] and (b) whatever single frequency is of interest right now.
#
# This file lives at /etc/radio/radiod@rtlsdr-adhoc.conf once deployed.
# Instance name is "rtlsdr-adhoc". Start with:
#   sudo systemctl enable --now radiod@rtlsdr-adhoc
#
# HOW THIS DIFFERS FROM EVERY OTHER radiod@ config IN THIS REPO:
#   Every other instance (rx888-hf, hackrf-2m) defines a fixed list of
#   [channel-name] sections, each with its own freq — radiod demodulates
#   all of them continuously and simultaneously. This file defines ONE
#   channel, [AD-HOC], meant to be retasked live via the `control`
#   program (or the Sigliere MCP server) to whatever frequency is
#   currently of interest.
#
#   This means there is NO fixed channel list to maintain here, and NO
#   occupancy producer polling it — tasking this channel is inherently
#   interactive/on-demand, not something a background sweep populates.
#   Don't add [freq-name] sections to this file expecting continuous
#   coverage; that's what radiod@hackrf-2m.conf and radiod@rx888-hf.conf
#   are for. This file's whole point is staying frequency-agnostic.
#
# WHY [AD-HOC] NO LONGER STARTS AT freq = 0 (CHANGED 2026-08-06):
#   ka9q-radio treats freq = 0 as a special "prototype" sentinel: a
#   dormant channel that only becomes real once tasked live against an
#   unused SSRC, and which self-destructs ("goes away 20 sec after last
#   command", per radio.c's own comment) if that first live command
#   doesn't land in time. Live-testing this exact channel found that a
#   freq = 0 start on THIS hardware never actually recovers: radiod
#   only sends a guaranteed status reply on the very first command that
#   creates the channel (radio_status.c); every subsequent command
#   (the one that would set a real frequency) is only queued for the
#   channel's own per-block loop to pick up, and that loop's very first
#   check is the freq==0 self-destruct countdown, checked BEFORE it
#   processes the queued command. mcp-server/config/nodes.json declares
#   min_hz = 24000000 for this device, and every startup logged
#   "[R82XX] PLL not locked!" falling back to 28.8 MHz — 0 Hz is below
#   what this RTL-SDR can actually tune to, consistent with the
#   channel's per-block processing never running normally while parked
#   there, so the retasking command that would move it to a real
#   frequency never got applied or acknowledged, in every tool tested
#   (ka9q-python at 5s and 15s timeouts, the native `control` TUI).
#   Full trace: docs/mcp-validation-evidence.md, "rtlsdr-v4 Root Cause:
#   freq=0 Bootstrap Trap in radiod".
#
#   Starting at a real, in-range frequency instead means the freq==0
#   self-destruct check never fires, so this is a normal, continuously-
#   running channel from boot — like any [freq-name] section in
#   rx888-hf.conf/hackrf-2m.conf — and should be retaskable live via
#   `control`/ka9q-python the same way those are. NOT YET CONFIRMED on
#   real hardware; this is the fix being tested, not a verified result.
#   If it doesn't resolve the issue, don't assume this comment is still
#   accurate — re-check against mcp-validation-evidence.md.
#
# FIELD-VERIFY BEFORE RELYING ON THIS:
#   1. CHECKED 2026-08-05, gap closed: no companion rtlsdrd daemon is
#      needed. radiod loads RTL-SDR support directly via its own
#      src/rtlsdr.c / rtlsdr.so front-end driver — same plugin pattern
#      already working for rx888-hf and hackrf-2m, neither of which
#      needs a separate daemon. No rtlsdrd binary exists anywhere on
#      this host, and ka9q-radio's own docs/SDR/rtlsdr.md describes
#      direct `[global] hardware = rtlsdr` config with no daemon. The
#      earlier claim here was wrong; do not act on it.
#   2. The EXACT `control` program invocation to task this channel (set
#      SSRC, frequency, mode, bandwidth against a running radiod
#      instance) is still NOT confirmed here — multiple secondary
#      sources describe the mechanism (freq=0 prototype + control +
#      unused SSRC) but none gave a verified command line. Note: the
#      Sigliere MCP server does not use the `control` CLI for this —
#      it goes through ka9q-python's `RadiodControl.ensure_channel`/
#      `create_channel`, already proven live against rx888-hf and
#      hackrf-vhf-uhf (see docs/mcp-validation-evidence.md), but NOT
#      yet proven against an instance with zero pre-existing fixed
#      channels, which is what this file is. Don't invent flags here
#      or downstream — confirm them live.
#   3. CHECKED 2026-08-05: `radiod -I <conf>` (suggested below under
#      NEXT STEPS) is NOT a real flag on this build. The binary's own
#      usage banner lists it, but its actual getopt string only
#      recognizes -N, -v, -V. There is no config-validate/dry-run mode
#      here — starting the service is the only way to exercise this
#      file.
#
# SINGLE-OWNER NOTE: same rule as every other front end in this repo —
# this RTL-SDR cannot be used by OpenWebRX+ while this radiod instance
# owns it, and vice versa.
# ============================================================================

[global]
hardware = rtlsdr

status = rtlsdr-adhoc-status.local

# A default mode/preset IS required for the [AD-HOC] channel to be
# instantiable at all (per ka9q-radio's own config parser: the preset
# must be specified, globally or per-section, before a channel can be
# created). fm is a reasonable default for VHF/UHF ad hoc use;
# override per-tasking-command if the frequency of interest needs a
# different mode (am/usb/lsb/cw/iq/etc — whatever `control` allows you
# to specify when tasking).
mode = fm

samprate = 12000

ttl = 0

# Minimal — one ad hoc channel, not dozens of simultaneous demodulators.
# Far lighter FFT load than either the RX-888 HF instance or HackRF's
# 2m instance.
fft-threads = 2

overlap = 5

# ----------------------------------------------------------------------
# Front-end hardware section
# ----------------------------------------------------------------------
[rtlsdr]
device = "rtlsdr"
description = "sovereign-sigint RTL-SDR ad hoc single-frequency tasking"

# Modest sample rate — this device isn't covering a fixed wide span like
# the occupancy configs; it's tuned to whatever single frequency is
# currently tasked, so a narrower capture window is fine and lighter on
# CPU/USB than the earlier tabled rtlsdr-vhf draft's 2.4 Msps.
samprate = 1000000

iface = eth0

status = rtlsdr-adhoc-status.local
data = rtlsdr-adhoc-iq.local
ssrc = 40

# Gain: NOT calibrated for this use case. The existing scan-based
# producer's g0 finding (R820T discriminates best at minimum gain) was
# for occupancy detection on FIXED known channels — ad hoc tasking could
# be aimed at anything (weak or strong signal, known or unknown), so a
# single fixed gain is a worse fit here than for the occupancy configs.
# Consider whether `control` lets gain be set per-tasking-command rather
# than fixed here; if not, start at manual g0 as a safe default and
# expect to override per use, not treat this number as calibrated truth.
gain = 0
gainmode = manual

# ============================================================================
# AD HOC CHANNEL — the entire point of this config.
# freq is a real, in-range starting value (not the ka9q-radio freq=0
# "prototype" sentinel — see header note "WHY [AD-HOC] NO LONGER STARTS
# AT freq = 0" for why that was changed 2026-08-06). Retask live via
# `control` against this channel's ssrc, or via the Sigliere MCP server
# (see header notes — exact `control` invocation NOT confirmed here,
# field-verify before use).
#
# 24,920,000 Hz (24.92 MHz) chosen only as a safe, in-range default —
# comfortably above this device's declared min_hz (24,000,000, per
# mcp-server/config/nodes.json) so radiod's dynamic-channel logic never
# has a reason to treat this as an unconfigured/prototype channel. Not
# a calibrated or otherwise meaningful frequency; expect to retask it
# immediately on startup for real use.
# ============================================================================

[AD-HOC]
data = rtlsdr-adhoc-pcm.local
freq = 24920000

